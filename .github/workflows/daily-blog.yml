name: Daily Automated Blog Upload System (100% Free)

on:
  schedule:
    # Run every day at 00:00 UTC (Midnight)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  publish-daily-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/node-module-setup@v4
        with:
          node-version: '18'

      - name: Execute Daily Official Blog Generator Script
        run: |
          node scripts/daily-blog.js
        env:
          FIREBASE_PROJECT_ID: "website-ab545"
