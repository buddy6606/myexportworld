name: Daily Official Govt Data Blog Publisher (6:00 AM IST)

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST (Indian Standard Time)
    - cron: '30 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab anytime

jobs:
  publish-daily-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Daily Official Blog Generator Script
        run: |
          node scripts/daily-blog.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: "website-ab545"

      - name: Commit & Push New Daily Blog
        run: |
          git config --global user.name "MyExportWorld Automation"
          git config --global user.email "bot@myexportworld.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-publish verified daily government trade blog [skip ci]" && git push)
